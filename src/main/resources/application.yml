server:
  port: 8080

spring:
  application:
    name: flash-sale-product-service
  datasource:
    url: jdbc:h2:mem:flashsale;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  cache:
    type: caffeine
    cache-names: flash-sale
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m

logging:
  level:
    com.storex.flashsale: INFO
